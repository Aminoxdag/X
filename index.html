<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- هذا السطر هو الحل لتشغيل فيديوهات تويتر مباشرة دون حظر -->
    <meta name="referrer" content="no-referrer">
    <title>منصة الوسائط | X Media Deck</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM (UMD Production Versions from cdnjs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone Translator (Stable cdnjs Version) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap');
        body { 
            background-color: #050505; 
            color: #e5e7eb; 
            font-family: 'IBM Plex Sans Arabic', sans-serif; 
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>

    <div id="root"></div>

    <!-- تم إضافة data-presets="react" لإجبار بابل على معالجة JSX فقط دون توليد أو إبقاء أي عبارات استيراد حديثة تسبب أخطاء المتصفح -->
    <script type="text/babel" data-presets="react">
        // استخراج الخصائص المطلوبة من المتغيرات العالمية المسجلة في المتصفح تلقائياً
        const { useState, useEffect, useRef } = window.React;
        const { createRoot } = window.ReactDOM;
        
        // تعريف الأيقونات يدوياً كـ React SVG Components مستقلة لمنع أخطاء المكتبة الخارجية والـ forwardRef تماماً
        const Download = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        );

        const Plus = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        );

        const Copy = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
        );

        const Trash2 = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                <line x1="10" y1="11" x2="10" y2="17"/>
                <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
        );

        const X = ({ size = 24, strokeWidth = "2", className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        );

        const User = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        );

        const ChevronLeft = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="15 18 9 12 15 6"/>
            </svg>
        );

        const ChevronRight = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="9 18 15 12 9 6"/>
            </svg>
        );

        const RefreshCw = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="23 4 23 10 17 10"/>
                <polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
        );

        const Video = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M23 7l-7 5 7 5V7z"/>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
        );

        const Clipboard = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            </svg>
        );

        const FileText = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        );

        const ExternalLink = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
        );

        const Zap = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        );

        const Check = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        );

        const UploadCloud = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                <polyline points="16 16 12 12 8 16"/>
                <line x1="12" y1="12" x2="12" y2="21"/>
            </svg>
        );

        const LinkIcon = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
        );

        const ImageIcon = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
            </svg>
        );

        // --- قائمة البروكسي (وسطاء) لتجاوز CORS ---
        const CORS_PROXIES = [
            (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        const fetchBlobWithProxy = async (url) => {
            let lastError;
            for (const proxyFunc of CORS_PROXIES) {
                try {
                    const proxyUrl = proxyFunc(url);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`Proxy failed: ${response.status}`);
                    return await response.blob();
                } catch (e) {
                    console.warn("Proxy attempt failed:", e);
                    lastError = e;
                }
            }
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Direct fetch failed');
                return await response.blob();
            } catch (e) {
                throw lastError || e;
            }
        };

        // --- Lightbox Component ---
        const Lightbox = ({ media, onClose }) => {
            if (!media) return null;
            return (
                <div className="fixed inset-0 z-50 bg-black/98 backdrop-blur-xl flex items-center justify-center p-4 animate-[fadeIn_0.2s_ease-out]">
                    <button onClick={onClose} className="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition-all">
                        <X size={32} />
                    </button>
                    <div className="w-full max-w-5xl h-full max-h-[90vh] flex items-center justify-center">
                        {media.type === 'video' ? (
                            <video src={media.url} controls autoPlay className="max-w-full max-h-full rounded-lg shadow-2xl border border-gray-800" />
                        ) : (
                            <img src={media.url} alt="Full view" className="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-gray-800" />
                        )}
                    </div>
                </div>
            );
        };

        // --- Tweet Card Component ---
        const TweetCard = ({ tweet, onRemove, onOpenLightbox }) => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isCopying, setIsCopying] = useState(false);
            const [isCatboxCopying, setIsCatboxCopying] = useState(false);
            const [isUploading, setIsUploading] = useState(false);
            const [catboxUrl, setCatboxUrl] = useState(null);
            const [uploadProgress, setUploadProgress] = useState(0); 
            const [isDownloading, setIsDownloading] = useState(false);
            
            const currentMedia = tweet.media[currentIndex];

            useEffect(() => {
                setIsUploading(false);
                setCatboxUrl(null);
                setUploadProgress(0);
                setIsDownloading(false);
            }, [currentIndex]);

            const nextSlide = (e) => { 
                e.stopPropagation(); 
                setCurrentIndex((prev) => (prev === tweet.media.length - 1 ? 0 : prev + 1)); 
            };
            
            const prevSlide = (e) => { 
                e.stopPropagation(); 
                setCurrentIndex((prev) => (prev === 0 ? tweet.media.length - 1 : prev - 1)); 
            };

            const downloadCurrent = async (e) => {
                e.stopPropagation();
                if (isDownloading) return;
                setIsDownloading(true);

                const item = currentMedia;
                const filename = `${tweet.handle}_${tweet.id}_${currentIndex}.${item.type === 'video' ? 'mp4' : 'jpg'}`;
                
                try {
                    const blob = await fetchBlobWithProxy(item.url);
                    const url = window.URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.href = url; 
                    link.download = filename;
                    document.body.appendChild(link); 
                    link.click();
                    document.body.removeChild(link); 
                    window.URL.revokeObjectURL(url);
                } catch (e) { 
                    console.error("Download failed, opening fallback:", e);
                    window.open(item.url, '_blank'); 
                } finally {
                    setIsDownloading(false);
                }
            };

            const uploadToCatbox = async (e) => {
                e.stopPropagation();
                if (isUploading || catboxUrl) return;

                setIsUploading(true);
                setUploadProgress(1); 
                
                try {
                    const blob = await fetchBlobWithProxy(currentMedia.url);
                    setUploadProgress(2); 

                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    const filename = `x_deck_${tweet.id}_${Date.now()}.mp4`;
                    const file = new File([blob], filename, { type: 'video/mp4' });
                    formData.append('fileToUpload', file);

                    const targetUrl = 'https://catbox.moe/user/api.php';
                    const postProxies = [
                        { url: (target) => `https://thingproxy.freeboard.io/fetch/${target}` },
                        { url: (target) => `https://corsproxy.io/?${encodeURIComponent(target)}` } 
                    ];

                    let resultUrl = null;

                    for (const proxy of postProxies) {
                        try {
                            const proxyUrl = proxy.url(targetUrl);
                            const response = await fetch(proxyUrl, {
                                method: 'POST',
                                body: formData
                            });

                            if (response.ok) {
                                const text = await response.text();
                                if (text && text.startsWith('http')) {
                                    resultUrl = text;
                                    break;
                                }
                            }
                        } catch (err) {
                            console.warn("Upload proxy failed:", err);
                        }
                    }

                    if (resultUrl) {
                        setCatboxUrl(resultUrl);
                    } else {
                        throw new Error('فشل الرفع. الخوادم الوسيطة مشغولة، حاول مرة أخرى.');
                    }

                } catch (err) {
                    console.error(err);
                    alert(`فشل العملية: ${err.message}`);
                } finally {
                    setIsUploading(false);
                    setUploadProgress(0);
                }
            };

            const copyText = (textToCopy, type = 'link') => {
                if (!textToCopy) return;
                
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed"; 
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea); 
                textArea.focus(); 
                textArea.select();
                document.execCommand('copy'); 
                document.body.removeChild(textArea);
                
                if (type === 'link') {
                    setIsCopying(true); 
                    setTimeout(() => setIsCopying(false), 1500);
                } else if (type === 'catbox') {
                    setIsCatboxCopying(true); 
                    setTimeout(() => setIsCatboxCopying(false), 1500);
                } else {
                    const btn = document.getElementById(`text-copy-${tweet.id}`);
                    if (btn) { 
                        btn.style.color = '#4ade80'; 
                        setTimeout(() => btn.style.color = '', 500); 
                    }
                }
            };

            return (
                <div className="bg-[#111111] border border-[#222] rounded-3xl overflow-hidden shadow-2xl hover:border-gray-700 transition-all duration-300 group relative flex flex-col h-full">
                    {/* Header */}
                    <div className="p-4 flex items-center justify-between bg-[#161616] border-b border-[#222]">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-full p-[1px] bg-gray-700 overflow-hidden">
                                {tweet.avatar ? <img src={tweet.avatar} className="w-full h-full object-cover" /> : <User size={20} className="text-gray-400 m-auto" />}
                            </div>
                            <div className="flex flex-col">
                                <span className="font-bold text-sm text-gray-200 leading-tight">{tweet.author}</span>
                                <span className="text-xs text-gray-500 font-mono">@{tweet.handle}</span>
                            </div>
                        </div>
                        <button onClick={() => onRemove(tweet.id)} className="text-gray-600 hover:text-red-500 p-2 rounded-full hover:bg-red-500/10">
                            <Trash2 size={18} />
                        </button>
                    </div>

                    {/* Media Viewer */}
                    <div className="relative aspect-[4/3] bg-black cursor-zoom-in overflow-hidden border-b border-[#222]" onClick={() => onOpenLightbox(currentMedia)}>
                        <div className="w-full h-full flex items-center justify-center bg-black">
                            {currentMedia.type === 'video' ? (
                                <video 
                                    src={currentMedia.url} 
                                    className="w-full h-full object-contain" 
                                    poster={currentMedia.thumb} 
                                    controls 
                                    onClick={(e) => e.stopPropagation()} 
                                    referrerPolicy="no-referrer"
                                />
                            ) : (
                                <img src={currentMedia.url} className="w-full h-full object-contain" referrerPolicy="no-referrer" />
                            )}
                        </div>
                        {tweet.media.length > 1 && (
                            <>
                                <button onClick={prevSlide} className="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-2 rounded-full backdrop-blur-md opacity-0 group-hover:opacity-100 transition-all">
                                    <ChevronLeft size={20} />
                                </button>
                                <button onClick={nextSlide} className="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-2 rounded-full backdrop-blur-md opacity-0 group-hover:opacity-100 transition-all">
                                    <ChevronRight size={20} />
                                </button>
                                <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10 px-3 py-1.5 rounded-full bg-black/60 backdrop-blur-md border border-white/5">
                                    {tweet.media.map((_, idx) => (
                                        <div key={idx} className={`h-1.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'bg-white w-6' : 'bg-white/30 w-1.5'}`} />
                                    ))}
                                </div>
                            </>
                        )}
                        <div className="absolute top-3 right-3 bg-black/70 backdrop-blur-md px-2 py-1 rounded-lg text-[10px] font-bold uppercase flex items-center gap-1 border border-white/10 text-gray-200">
                            {currentMedia.type === 'video' ? <Video size={10} /> : <ImageIcon size={10} />} <span>{currentIndex + 1}/{tweet.media.length}</span>
                        </div>
                    </div>

                    {/* Tweet Text */}
                    {tweet.text && (
                        <div className="px-5 py-4 bg-[#111] text-right border-b border-[#222] flex-1">
                            <p className="text-sm text-gray-300 leading-7 whitespace-pre-wrap" dir="auto">{tweet.text}</p>
                        </div>
                    )}

                    {/* Action Footer */}
                    <div className="p-3 bg-[#161616] mt-auto flex flex-wrap gap-2 items-center">
                        {/* Download Button */}
                        <button onClick={downloadCurrent} disabled={isDownloading} className="flex-1 bg-[#222] hover:bg-[#333] text-gray-200 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all border border-[#333] min-w-[80px]">
                            {isDownloading ? <RefreshCw size={14} className="animate-spin" /> : <Download size={14} />} 
                            <span className="hidden sm:inline">{isDownloading ? 'جاري التحميل..' : 'تحميل'}</span>
                        </button>

                        {/* Catbox Upload / Result Area */}
                        {currentMedia.type === 'video' ? (
                            catboxUrl ? (
                                <div className="flex-[2] flex items-center gap-2 bg-[#1a1a1a] border border-blue-900/50 rounded-xl p-1 animate-[fadeIn_0.3s_ease-out]">
                                    <div className="bg-blue-900/20 p-1.5 rounded-lg text-blue-400">
                                        <LinkIcon size={14} />
                                    </div>
                                    <input 
                                        type="text" 
                                        value={catboxUrl} 
                                        readOnly 
                                        className="bg-transparent text-blue-100 text-[10px] sm:text-xs px-1 w-full outline-none font-mono dir-ltr text-left truncate"
                                        onClick={(e) => e.target.select()}
                                    />
                                    <button 
                                        onClick={() => copyText(catboxUrl, 'catbox')}
                                        className={`p-1.5 rounded-lg transition-all flex-shrink-0 ${isCatboxCopying ? 'bg-green-500 text-white' : 'bg-[#333] text-gray-400 hover:text-white'}`}
                                        title="نسخ الرابط"
                                    >
                                        {isCatboxCopying ? <Check size={14} /> : <Copy size={14} />}
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={uploadToCatbox} 
                                    disabled={isUploading}
                                    className="flex-1 bg-[#222] hover:bg-[#333] text-gray-200 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all border border-[#333] min-w-[100px]"
                                >
                                    {isUploading ? (
                                        <RefreshCw size={14} className="animate-spin" />
                                    ) : (
                                        <UploadCloud size={14} />
                                    )}
                                    <span>
                                        {isUploading 
                                            ? (uploadProgress === 1 ? 'جلب الملف...' : 'رفع Catbox...') 
                                            : 'رفع Catbox'}
                                    </span>
                                </button>
                            )
                        ) : null}

                        {/* Copy Link Button */}
                        <button onClick={() => copyText(currentMedia.url, 'link')} className={`${isCopying ? 'bg-green-900/20 text-green-400 border-green-900/50' : 'bg-[#222] text-gray-400 hover:bg-[#333] border-[#333]'} flex-1 border py-2.5 px-3 rounded-xl text-xs font-medium flex items-center justify-center gap-2 transition-all min-w-[80px]`}>
                            {isCopying ? <Check size={14} /> : <Copy size={14} />} <span className="hidden sm:inline">{isCopying ? 'منسوخ' : 'رابط'}</span>
                        </button>

                        {/* Copy Text Button */}
                        <button id={`text-copy-${tweet.id}`} onClick={() => copyText(tweet.text, 'text')} className="bg-[#222] text-gray-500 hover:text-white hover:bg-[#333] border border-[#333] w-10 h-10 rounded-xl flex items-center justify-center transition-all flex-shrink-0" title="نسخ النص">
                            <FileText size={14} />
                        </button>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [input, setInput] = useState('');
            const [tweets, setTweets] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [lightboxMedia, setLightboxMedia] = useState(null);
            const inputRef = useRef(null);

            useEffect(() => {
                const saved = localStorage.getItem('x-media-deck-data');
                if (saved) { 
                    try { 
                        setTweets(JSON.parse(saved)); 
                    } catch (e) {
                        console.error("Failed to parse saved data", e);
                    } 
                }
            }, []);

            useEffect(() => { 
                localStorage.setItem('x-media-deck-data', JSON.stringify(tweets)); 
            }, [tweets]);

            const extractTweetId = (urlInput) => {
                try {
                    let safeUrl = urlInput.trim();
                    if (!safeUrl.startsWith('http')) {
                        safeUrl = `https://${safeUrl}`;
                    }
                    
                    const urlObj = new URL(safeUrl);
                    if (urlObj.hostname.includes('twitter.com') || urlObj.hostname.includes('x.com')) {
                        const pathSegments = urlObj.pathname.split('/');
                        const statusIndex = pathSegments.indexOf('status');
                        if (statusIndex !== -1 && pathSegments[statusIndex + 1]) return pathSegments[statusIndex + 1];
                    }
                    return null;
                } catch (e) { 
                    return null; 
                }
            };

            const fetchTweetData = async (id) => {
                try {
                    const response = await fetch(`https://api.fxtwitter.com/status/${id}`);
                    if (!response.ok) throw new Error('Network error');
                    const data = await response.json();
                    const mediaList = [];
                    
                    if (data?.tweet?.media?.videos) {
                        data.tweet.media.videos.forEach(v => mediaList.push({ type: 'video', url: v.url, thumb: v.thumbnail_url }));
                    }
                    
                    if (data?.tweet?.media?.photos) {
                        const hasVideo = mediaList.some(m => m.type === 'video');
                        if (!hasVideo || mediaList.length === 0) {
                            data.tweet.media.photos.forEach(p => mediaList.push({ type: 'image', url: p.url, thumb: p.url }));
                        }
                    }
                    
                    if (mediaList.length === 0) return null;
                    return {
                        id: id, 
                        text: data.tweet.text, 
                        author: data.tweet.author.name, 
                        handle: data.tweet.author.screen_name,
                        avatar: data.tweet.author.avatar_url, 
                        media: mediaList, 
                        timestamp: Date.now()
                    };
                } catch (error) { 
                    return null; 
                }
            };

            const handlePaste = async () => {
                try { 
                    const text = await navigator.clipboard.readText(); 
                    setInput(text); 
                } catch (err) { 
                    alert("الصق الرابط يدوياً"); 
                }
            };

            const handleAddLink = async () => {
                if (!input.trim()) return;
                setIsProcessing(true);
                
                const regex = /((https?:\/\/)?(www\.)?(twitter\.com|x\.com)\/[a-zA-Z0-9_]+\/status\/[0-9]+)/g;
                const rawMatches = input.match(regex) || [];
                
                if (rawMatches.length === 0) {
                    alert("لم يتم العثور على رابط صحيح! تأكد أن الرابط يحتوي على x.com أو twitter.com ورقم التغريدة.");
                    setIsProcessing(false);
                    return;
                }

                const newTweets = [];
                const uniqueUrls = [...new Set(rawMatches)];

                for (const url of uniqueUrls) {
                    const id = extractTweetId(url);
                    if (id && !tweets.some(t => t.id === id)) {
                        const tweetData = await fetchTweetData(id);
                        if (tweetData) newTweets.push(tweetData);
                    }
                }

                setTweets(prev => [...newTweets, ...prev]);
                setInput('');
                setIsProcessing(false);
            };

            const removeTweet = (id) => setTweets(prev => prev.filter(t => t.id !== id));
            const clearAll = () => { 
                if (window.confirm("هل أنت متأكد من حذف جميع العناصر؟")) setTweets([]); 
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4 sm:p-8 overflow-x-hidden">
                    {lightboxMedia && <Lightbox media={lightboxMedia} onClose={() => setLightboxMedia(null)} />}

                    <header className="w-full max-w-5xl flex justify-between items-center mb-10 z-10">
                        <div className="flex items-center gap-4">
                            <div className="bg-[#111] border border-[#333] text-white p-3 rounded-2xl shadow-xl">
                                <X size={24} strokeWidth={3} />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-white">منصة الوسائط</h1>
                                <p className="text-xs text-gray-600">تم إصلاح مشكلة التشغيل والمزامنة</p>
                            </div>
                        </div>
                        {tweets.length > 0 && (
                            <button onClick={clearAll} className="bg-[#111] border border-[#333] text-gray-400 hover:text-red-400 px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2">
                                <Trash2 size={14} /> تنظيف الكل
                            </button>
                        )}
                    </header>

                    <main className="w-full max-w-5xl space-y-8 z-10">
                        <div className="bg-[#111] border border-[#333] rounded-3xl p-2 pl-3 flex gap-2 shadow-lg">
                            <button onClick={handlePaste} className="sm:hidden bg-[#222] text-gray-300 p-3 rounded-xl hover:bg-[#333]">
                                <Clipboard size={20} />
                            </button>
                            <input 
                                ref={inputRef} 
                                type="text" 
                                value={input} 
                                onChange={(e) => setInput(e.target.value)} 
                                onKeyDown={(e) => e.key === 'Enter' && handleAddLink()} 
                                placeholder="الصق رابط التغريدة هنا (x.com/...)" 
                                className="flex-1 bg-transparent border-none text-gray-200 px-3 py-3 focus:ring-0 placeholder-gray-700 text-sm font-medium dir-rtl text-right outline-none truncate" 
                            />
                            <button 
                                onClick={handleAddLink} 
                                disabled={isProcessing || !input.trim()} 
                                className={`px-6 rounded-2xl font-bold text-sm flex items-center gap-2 transition-all ${isProcessing ? 'bg-[#222] text-gray-500' : 'bg-white text-black hover:bg-gray-200'}`}
                            >
                                {isProcessing ? <RefreshCw className="animate-spin" size={20} /> : <Plus size={20} />} 
                                <span className="hidden sm:inline">إضافة</span>
                            </button>
                        </div>

                        {tweets.length > 0 && (
                            <div className="flex justify-between px-4 text-xs text-gray-600">
                                <span>البطاقات المضافة: {tweets.length}</span>
                                <span className="flex items-center gap-1"><Zap size={12} /> تحديث تلقائي</span>
                            </div>
                        )}
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-20">
                            {tweets.map((tweet) => (
                                <TweetCard 
                                    key={tweet.id} 
                                    tweet={tweet} 
                                    onRemove={removeTweet} 
                                    onOpenLightbox={setLightboxMedia} 
                                />
                            ))}
                        </div>

                        {tweets.length === 0 && !isProcessing && (
                            <div className="text-center py-24 opacity-30 flex flex-col items-center">
                                <ExternalLink size={40} className="text-gray-500 mb-4" />
                                <h3 className="text-xl font-bold text-gray-300">لا توجد بطاقات معروضة حالياً</h3>
                                <p className="text-xs text-gray-500 mt-2">يرجى نسخ رابط التغريدة وإضافته بالأعلى</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
